    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: rgba(255, 255, 255, 0.04);
      --border: #232f48;
      --accent: #6366f1;
      --cyan: #22d3ee;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none; z-index: 0;
    }

    .content { position: relative; z-index: 1; }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--cyan);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--accent), #4338ca);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .code {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 24px;
    }

    .info-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .info-icon {
      font-size: 22px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .info-content { flex: 1; }
    .info-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
    .info-value { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; }

    .btn-action {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-check:active { transform: scale(0.98); }
    .btn-check.checked {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--green);
      color: var(--green);
      box-shadow: none;
    }

    .status-msg {
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
      margin-top: -4px;
      margin-bottom: 12px;
      display: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>

    } else if (t.indexOf('t\u00e9l\u00e9phone') !== -1 || t.indexOf('tel') !== -1) {
      icon = '\u{1F4DE}';
    } else if (t.indexOf('placard') !== -1 || t.indexOf('armoire') !== -1 || t.indexOf('caisson') !== -1) {
      icon = '\u{1F5C4}';
    } else if (t.indexOf('chariot') !== -1) {
      icon = '\u{1F6D2}';
    } else if (t.indexOf('pointeuse') !== -1) {
      icon = '\u23F0';
    } else if (t.indexOf('moniteur') !== -1 || t.indexOf('ecran') !== -1) {
      icon = '\u{1F5A5}';
    }
    document.getElementById('icon').textContent = icon;

    checkSavedStatus();
  });

  function checkSavedStatus() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    var isChecked = history.some(function(h) { return h.code === currentCode; });
    if (isChecked) setBtnChecked();
  }

  function toggleCheck() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    var idx = history.findIndex(function(h) { return h.code === currentCode; });

    if (idx > -1) {
      history.splice(idx, 1);
      localStorage.setItem('mob_history', JSON.stringify(history));
      setBtnUnchecked();
    } else {
      history.unshift({
        code: currentCode,
        type: document.getElementById('type').textContent,
        aff:  document.getElementById('aff').textContent,
        svc:  document.getElementById('svc').textContent,
        loc:  document.getElementById('loc').textContent,
        scannedAt: new Date().toISOString()
      });
      localStorage.setItem('mob_history', JSON.stringify(history));
      setBtnChecked();
    }
  }

  function setBtnChecked() {
    var btn = document.getElementById('checkBtn');
    btn.className = 'btn-action btn-check checked';
    document.getElementById('checkIcon').textContent = '\u2714';
    document.getElementById('checkText').textContent = 'V\u00e9rifi\u00e9 & Pr\u00e9sent';
    document.getElementById('statusMsg').style.display = 'block';
  }

  function setBtnUnchecked() {
    var btn = document.getElementById('checkBtn');
    btn.className = 'btn-action btn-check';
    document.getElementById('checkIcon').textContent = '\u2713';
    document.getElementById('checkText').textContent = 'Marquer comme v\u00e9rifi\u00e9 aujourd\'hui';
    document.getElementById('statusMsg').style.display = 'none';
  }
</script>

</body>
</html>
