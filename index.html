  <title>MoB BSK &#8212; Fiche &#201;quipement Inventaire</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: rgba(255, 255, 255, 0.04);
      --border: #232f48;
      --accent: #6366f1;
      --cyan: #22d3ee;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none; z-index: 0;
    }

    .content { position: relative; z-index: 1; }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--cyan);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--accent), #4338ca);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 24px;
      word-break: break-word;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 24px;
    }

    .info-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .info-icon {
      font-size: 22px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .info-content { flex: 1; }
    .info-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
    .info-value { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; word-break: break-word; }

    .btn-action {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-check:active { transform: scale(0.98); }
    .btn-check.checked {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--green);
      color: var(--green);
      box-shadow: none;
    }

    .status-msg {
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
      margin-top: -4px;
      margin-bottom: 12px;
      display: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>

  let currentCode = '';

  window.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    var codeParam = decodeURIComponent(params.get('code') || 'BSK-MOB-001').trim();

    currentCode = codeParam;

    // 1. Recherche exacte par nom d'inventaire complet (ex: "BSK-INF-001 Poste ordinateur" ou "BSK-MOB-003 Bureau")
    var found = null;
    for (var i = 0; i < INVENTORY_DB.length; i++) {
      var raw = String(INVENTORY_DB[i].Inventaire || INVENTORY_DB[i].code || '').trim();
      if (raw.toLowerCase() === codeParam.toLowerCase()) {
        found = INVENTORY_DB[i];
        break;
      }
    }

    // 2. Si pas de correspondance exacte, recherche du prefixe au debut
    if (!found) {
      for (var i = 0; i < INVENTORY_DB.length; i++) {
        var raw = String(INVENTORY_DB[i].Inventaire || INVENTORY_DB[i].code || '').trim();
        var sp = raw.indexOf(' ');
        var numCode = sp > -1 ? raw.slice(0, sp) : raw;
        if (numCode.toLowerCase() === codeParam.toLowerCase()) {
          found = INVENTORY_DB[i];
          break;
        }
      }
    }

    // 3. Fallback recherche contient
    if (!found) {
      for (var i = 0; i < INVENTORY_DB.length; i++) {
        var raw = String(INVENTORY_DB[i].Inventaire || INVENTORY_DB[i].code || '').trim();
        if (raw.toLowerCase().indexOf(codeParam.toLowerCase()) !== -1) {
          found = INVENTORY_DB[i];
          break;
        }
      }
    }

    var finalType       = '';
    var finalFullInv    = codeParam;
    var finalAff        = '';
    var finalSvc        = '';
    var finalLoc        = '';
    var finalMarque     = '';
    var finalSN         = '';

    if (found) {
      var raw = String(found.Inventaire || '');
      finalFullInv = raw; // NumÃ©ro d'inventaire complet (ex: "BSK-INF-001 Poste ordinateur")
      
      var sp = raw.indexOf(' ');
      finalType    = sp > -1 ? raw.slice(sp + 1) : 'Article';
      finalAff     = String(found.Affectation || '').trim();
      finalSvc     = String(found.Service || '').trim();
      finalLoc     = String(found.Localisation || '').trim();
      finalMarque  = String(found.Marque || '').trim();
      finalSN      = String(found.SN || '').trim();
    } else {
      var sp = codeParam.indexOf(' ');
      if (sp > -1) {
        finalType = codeParam.slice(sp + 1);
      }
    }

    // Afficher le NumÃ©ro d'inventaire complet exact de l'Excel
    document.getElementById('code').textContent   = finalFullInv;
    document.getElementById('type').textContent   = finalType || 'Article';
    document.getElementById('aff').textContent    = finalAff  || 'Non affect\u00e9';
    document.getElementById('svc').textContent    = finalSvc  || '\u2014';
    document.getElementById('loc').textContent    = finalLoc  || '\u2014';
    document.getElementById('marque').textContent = finalMarque || '\u2014';
    document.getElementById('sn').textContent     = finalSN     || '\u2014';

    // Icone selon le type d'article (HTML entities / unicode)
    var t = (finalType || '').toLowerCase();
    var icon = '\u{1F4E6}'; // default box
    
    if (t.indexOf('imprimante') !== -1) {
      icon = '\u{1F5A8}'; // ðŸ–¨ï¸ printer
    } else if (t.indexOf('pc') !== -1 || t.indexOf('ordinateur') !== -1 || t.indexOf('laptop') !== -1 || t.indexOf('poste') !== -1) {
      icon = '\u{1F4BB}'; // ðŸ’» computer
    } else if (t.indexOf('t\u00e9l\u00e9phone') !== -1 || t.indexOf('tel') !== -1 || t.indexOf('mobile') !== -1 || t.indexOf('telf') !== -1) {
      icon = '\u{1F4DE}'; // ðŸ“ž phone
    } else if (t.indexOf('fax') !== -1) {
      icon = '\u{1F4E0}'; // ðŸ“  fax
    } else if (t.indexOf('projecteur') !== -1 || t.indexOf('retroprojecteur') !== -1) {
      icon = '\u{1F4FD}'; // ðŸ“¹ projector
    } else if (t.indexOf('pointeuse') !== -1) {
      icon = '\u23F0'; // â° clock
    } else if (t.indexOf('scanner') !== -1 || t.indexOf('ch\u00e8que') !== -1) {
      icon = '\u{1F4B3}'; // ðŸ’³ scanner/card
    } else if (t.indexOf('r\u00e9frig\u00e9rateur') !== -1 || t.indexOf('frigo') !== -1) {
      icon = '\u{1F9CA}'; // ðŸ§Š fridge
    } else if (t.indexOf('caisse') !== -1) {
      icon = '\u{1F4B0}'; // ðŸ’° cash
    } else if (t.indexOf('bureau') !== -1 || t.indexOf('chaise') !== -1 || t.indexOf('table') !== -1 || t.indexOf('comptoir') !== -1) {
      icon = '\u{1FA91}'; // ðŸª‘ chair
    } else if (t.indexOf('placard') !== -1 || t.indexOf('armoire') !== -1 || t.indexOf('caisson') !== -1) {
      icon = '\u{1F5C4}'; // ðŸ—„ï¸ cabinet
    } else if (t.indexOf('chariot') !== -1) {
      icon = '\u{1F6D2}'; // ðŸ›’ cart
    } else if (t.indexOf('moniteur') !== -1 || t.indexOf('ecran') !== -1) {
      icon = '\u{1F5A5}'; // ðŸ–¥ï¸ monitor
    }

    document.getElementById('icon').textContent = icon;

    checkSavedStatus();
  });

  function checkSavedStatus() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    var isChecked = history.some(function(h) { return h.code === currentCode; });
    if (isChecked) setBtnChecked();
  }

  function toggleCheck() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    var idx = history.findIndex(function(h) { return h.code === currentCode; });

    if (idx > -1) {
      history.splice(idx, 1);
      localStorage.setItem('mob_history', JSON.stringify(history));
      setBtnUnchecked();
    } else {
      history.unshift({
        code: currentCode,
        type: document.getElementById('type').textContent,
        aff:  document.getElementById('aff').textContent,
        svc:  document.getElementById('svc').textContent,
        loc:  document.getElementById('loc').textContent,
        marque: document.getElementById('marque').textContent,
        sn:   document.getElementById('sn').textContent,
        scannedAt: new Date().toISOString()
      });
      localStorage.setItem('mob_history', JSON.stringify(history));
      setBtnChecked();
    }
  }

  function setBtnChecked() {
    var btn = document.getElementById('checkBtn');
    btn.className = 'btn-action btn-check checked';
    document.getElementById('checkIcon').textContent = '\u2714';
    document.getElementById('checkText').textContent = 'V\u00e9rifi\u00e9 & Pr\u00e9sent';
    document.getElementById('statusMsg').style.display = 'block';
  }

  function setBtnUnchecked() {
    var btn = document.getElementById('checkBtn');
    btn.className = 'btn-action btn-check';
    document.getElementById('checkIcon').textContent = '\u2713';
    document.getElementById('checkText').textContent = 'Marquer comme v\u00e9rifi\u00e9 aujourd\'hui';
    document.getElementById('statusMsg').style.display = 'none';
  }
