<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Claritas &#8212; Fiche &#201;quipement Inventaire</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: rgba(255, 255, 255, 0.04);
      --border: #232f48;
      --accent: #e8652d;
      --accent-light: #f4845f;
      --cyan: #22d3ee;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(232, 101, 45, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none; z-index: 0;
    }

    .content { position: relative; z-index: 1; }

    .logo-container {
      margin-bottom: 16px;
    }
    .logo-container img {
      max-width: 180px;
      height: auto;
      border-radius: 8px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232, 101, 45, 0.15);
      border: 1px solid rgba(232, 101, 45, 0.3);
      color: var(--accent-light);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--accent), #c44a1a);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
      box-shadow: 0 12px 30px rgba(232, 101, 45, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: var(--accent-light);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 24px;
      word-break: break-word;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 24px;
    }

    .info-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .info-icon {
      font-size: 22px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .info-content { flex: 1; }
    .info-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
    .info-value { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; word-break: break-word; }

    .btn-action {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-check {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-check:active { transform: scale(0.98); }
    .btn-check.checked {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--green);
      color: var(--green);
      box-shadow: none;
    }

    .status-msg {
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
      margin-top: -4px;
      margin-bottom: 12px;
      display: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>

  let currentCode = '';

  window.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    var codeParam = decodeURIComponent(params.get('code') || 'BSK-MOB-001').trim();
    currentCode = codeParam;

    var found = null;
    for (var i = 0; i < INVENTORY_DB.length; i++) {
      var raw = String(INVENTORY_DB[i].Inventaire || '').trim();
      if (raw.toLowerCase() === codeParam.toLowerCase()) { found = INVENTORY_DB[i]; break; }
    }
    if (!found) {
      for (var i = 0; i < INVENTORY_DB.length; i++) {
        var raw = String(INVENTORY_DB[i].Inventaire || '').trim();
        var sp = raw.indexOf(' ');
        var numCode = sp > -1 ? raw.slice(0, sp) : raw;
        if (numCode.toLowerCase() === codeParam.toLowerCase()) { found = INVENTORY_DB[i]; break; }
      }
    }
    if (!found) {
      for (var i = 0; i < INVENTORY_DB.length; i++) {
        var raw = String(INVENTORY_DB[i].Inventaire || '').trim();
        if (raw.toLowerCase().indexOf(codeParam.toLowerCase()) !== -1) { found = INVENTORY_DB[i]; break; }
      }
    }

    var finalType = '', finalFullInv = codeParam, finalAff = '', finalSvc = '', finalLoc = '', finalMarque = '', finalSN = '';

    if (found) {
      var raw = String(found.Inventaire || '');
      finalFullInv = raw;
      var sp = raw.indexOf(' ');
      finalType   = sp > -1 ? raw.slice(sp + 1) : 'Article';
      finalAff    = String(found.Affectation || '').trim();
      finalSvc    = String(found.Service || '').trim();
      finalLoc    = String(found.Localisation || '').trim();
      finalMarque = String(found.Marque || '').trim();
      finalSN     = String(found.SN || '').trim();
    } else {
      var sp = codeParam.indexOf(' ');
      if (sp > -1) finalType = codeParam.slice(sp + 1);
    }

    document.getElementById('code').textContent   = finalFullInv;
    document.getElementById('type').textContent   = finalType || 'Article';
    document.getElementById('aff').textContent    = finalAff  || 'Non affect\u00e9';
    document.getElementById('svc').textContent    = finalSvc  || '\u2014';
    document.getElementById('loc').textContent    = finalLoc  || '\u2014';
    document.getElementById('marque').textContent = finalMarque || '\u2014';
    document.getElementById('sn').textContent     = finalSN     || '\u2014';

    var t = (finalType || '').toLowerCase();

    else if (t.indexOf('pc') !== -1 || t.indexOf('ordinateur') !== -1 || t.indexOf('laptop') !== -1 || t.indexOf('poste') !== -1) icon = '\u{1F4BB}';

    else if (t.indexOf('pointeuse') !== -1) icon = '\u23F0';

  function checkSavedStatus() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    if (history.some(function(h) { return h.code === currentCode; })) setBtnChecked();
  }

  function toggleCheck() {
    var history = JSON.parse(localStorage.getItem('mob_history') || '[]');
    var idx = history.findIndex(function(h) { return h.code === currentCode; });
    if (idx > -1) { history.splice(idx, 1); localStorage.setItem('mob_history', JSON.stringify(history)); setBtnUnchecked(); }
    else {
      history.unshift({ code: currentCode, type: document.getElementById('type').textContent, aff: document.getElementById('aff').textContent, svc: document.getElementById('svc').textContent, loc: document.getElementById('loc').textContent, marque: document.getElementById('marque').textContent, sn: document.getElementById('sn').textContent, scannedAt: new Date().toISOString() });
      localStorage.setItem('mob_history', JSON.stringify(history)); setBtnChecked();
    }
  }

    document.getElementById('checkBtn').className = 'btn-action btn-check checked';
    document.getElementById('checkIcon').textContent = '\u2714';
    document.getElementById('checkText').textContent = 'V\u00e9rifi\u00e9 & Pr\u00e9sent';
    document.getElementById('statusMsg').style.display = 'block';
  }
  function setBtnUnchecked() {
    document.getElementById('checkBtn').className = 'btn-action btn-check';
    document.getElementById('checkIcon').textContent = '\u2713';
    document.getElementById('checkText').textContent = 'Marquer comme v\u00e9rifi\u00e9 aujourd\'hui';
    document.getElementById('statusMsg').style.display = 'none';
  }
</script>
